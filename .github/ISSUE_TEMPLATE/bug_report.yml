name: Bug report
description: Report reproducible behavior that does not work as intended
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve JARVIS. Please do not include secrets or personal information. Report exploitable security issues through a private security channel instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I identified whether this concerns an implemented, experimental, or planned capability.
          required: true
  - type: input
    id: version
    attributes:
      label: JARVIS version or commit
      description: Output from the installed version, or the commit hash being tested.
      placeholder: 0.3.0 or abc1234
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.11.9
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: mode
    attributes:
      label: Mode and optional dependencies
      description: Identify terminal or GUI mode, offline or provider-backed operation, installed desktop/voice/browser/notification/GUI extras, and provider/integration names without credentials.
      placeholder: GUI mode, deterministic planner, gui extra installed, scheduler enabled
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and which command or interaction was involved?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, numbered sequence that reproduces the problem.
      placeholder: |
        1. Install ...
        2. Run `jarvis`
        3. Enter ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the smallest useful traceback or terminal output. Remove usernames, paths, tokens, and other sensitive data.
      render: shell
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant permission policy, provider, platform limitations, or attempted workarounds.
